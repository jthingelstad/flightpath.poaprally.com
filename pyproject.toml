[project]
name = "flight-path-data-tools"
version = "0.1.0"
description = "Data synchronization tools for Flight Path"
requires-python = ">=3.14,<3.15"
dependencies = [
    "python-dotenv>=1.2.2,<2",
    "requests>=2.34.2,<3",
]

[dependency-groups]
dev = ["ruff>=0.15.22,<0.16"]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
