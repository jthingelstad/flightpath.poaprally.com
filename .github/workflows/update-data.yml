name: Update Data & Deploy

on:
  schedule:
    - cron: "0 0 * * *" # Daily at 00:00 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14"
          enable-cache: true

      - name: Install Python dependencies
        run: uv sync --locked

      - name: Verify Python quality
        run: |
          uv run --locked ruff check scripts tests
          uv run --locked ruff format --check scripts tests
          uv run --locked python -m unittest discover -s tests -q

      - name: Fetch latest data
        env:
          POAP_CLIENT_ID: ${{ secrets.POAP_CLIENT_ID }}
          POAP_CLIENT_SECRET: ${{ secrets.POAP_CLIENT_SECRET }}
          POAP_API_KEY: ${{ secrets.POAP_API_KEY }}
          AIRTABLE_PAT: ${{ secrets.AIRTABLE_PAT }}
          AIRTABLE_BASE_ID: ${{ secrets.AIRTABLE_BASE_ID }}
          AIRTABLE_TEAMS_TABLE: Teams
          AIRTABLE_AIRPORTS_TABLE: Airports
        run: uv run --locked --no-dev python scripts/fetch_data.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add _data/ src/img/poaps/ src/img/avatars/ data/flightpath.db
          if git diff --cached --quiet; then
            echo "No data changes to commit"
          else
            git commit -m "Update data $(date -u +%Y-%m-%d)"
            git push
          fi

  build:
    needs: update
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npx @11ty/eleventy

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
